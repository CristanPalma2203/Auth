name: Container image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test src/Auth.Tests/Auth.Tests.csproj --configuration Release --nologo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/WebApi/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/cristanpalma2203/corelux-auth:latest
            ghcr.io/cristanpalma2203/corelux-auth:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-stg:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ca-corelux-auth-stg \
              --resource-group rg-corelux-stg \
              --image ghcr.io/cristanpalma2203/corelux-auth:${{ github.sha }} \
              --set-env-vars APP_COMMIT_SHA=${{ github.sha }}
